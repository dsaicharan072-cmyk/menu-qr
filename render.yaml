services:
  - type: web
    name: menuqr-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: menuqr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: menuqr-db
    plan: free
